<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Header and Logo Styling */
        header {
            background-color: #2d3a3f; /* Dark teal */
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }

        header h1 {
            font-size: 36px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Navigation Menu Styling */
        nav {
            text-align: center;
            margin: 20px 0;
        }

        nav a {
            color: #2d3a3f;
            text-decoration: none;
            padding: 12px 20px;
            margin: 0 15px;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }

        nav a:hover {
            background-color: #2d3a3f;
            color: #fff;
        }

        /* Gallery Section */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 50px 10%;
        }

        .gallery-item {
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-item .caption {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .gallery-item:hover .caption {
            opacity: 1;
        }

        .gallery-item .caption h3 {
            font-size: 24px;
            text-align: center;
        }

        /* Modal (For Image View) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 80%;
            max-height: 80%;
        }

        .modal img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Footer Styling */
        footer {
            background-color: #2d3a3f;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

    </style>
</head>
<body>

    <!-- Header Section with Logo -->
    <header>
        <h1>Janvi Kachhadiya</h1>
    </header>

    <!-- Navigation Bar -->
    <nav>
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="gallary.html">Gallery</a>
        <a href="portfolio.html">Portfolio</a>
    </nav>

    <!-- Gallery Section -->
    <div class="gallery">
        <div class="gallery-item" onclick="openModal('img1')">
            <img id="img1" src="https://images.pexels.com/photos/5583248/pexels-photo-5583248.jpeg" alt="Project 1">
            <div class="caption">
                <h3>Project 1</h3>
            </div>
        </div>

        <div class="gallery-item" onclick="openModal('img2')">
            <img id="img2" src="https://images.pexels.com/photos/4977460/pexels-photo-4977460.jpeg" alt="Project 2">
            <div class="caption">
                <h3>Project 2</h3>
            </div>
        </div>

        <div class="gallery-item" onclick="openModal('img3')">
            <img id="img3" src="https://images.pexels.com/photos/3183154/pexels-photo-3183154.jpeg" alt="Project 3">
            <div class="caption">
                <h3>Project 3</h3>
            </div>
        </div>

        <div class="gallery-item" onclick="openModal('img4')">
            <img id="img4" src="https://images.pexels.com/photos/3747140/pexels-photo-3747140.jpeg" alt="Project 4">
            <div class="caption">
                <h3>Project 4</h3>
            </div>
        </div>

        <div class="gallery-item" onclick="openModal('img5')">
            <img id="img5" src="https://images.pexels.com/photos/7438099/pexels-photo-7438099.jpeg" alt="Project 5">
            <div class="caption">
                <h3>Project 5</h3>
            </div>
        </div>

        <div class="gallery-item" onclick="openModal('img6')">
            <img id="img6" src="https://images.pexels.com/photos/5583248/pexels-photo-5583248.jpeg" alt="Project 6">
            <div class="caption">
                <h3>Project 6</h3>
            </div>
        </div>
    </div>

    <!-- Modal for Image View -->
    <div id="myModal" class="modal">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img id="modalImg" src="" alt="Modal Image">
        </div>
    </div>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 Janvi Kachhadiya. All Rights Reserved.</p>
    </footer>

    <script>
        // Open Modal Function
        function openModal(imageId) {
            var modal = document.getElementById('myModal');
            var modalImg = document.getElementById('modalImg');
            var imgElement = document.getElementById(imageId);
            modal.style.display = "flex";
            modalImg.src = imgElement.src;
        }   

        // Close Modal Function
        function closeModal() {
            var modal = document.getElementById('myModal');
            modal.style.display = "none";
        }
    </script>

</body>
</html>
