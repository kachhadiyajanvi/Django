<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f7f7f7;
            color: #4f4f4f;
        }

        /* Header and Logo Styling */
        header {
            background-color: #4f4f4f; /* Dark gray */
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }

        header h1 {
            font-size: 36px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Navigation Menu Styling */
        nav {
            text-align: center;
            margin: 20px 0;
        }

        nav a {
            color: #4f4f4f;
            text-decoration: none;
            padding: 12px 20px;
            margin: 0 15px;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }

        nav a:hover {
            background-color: #4f4f4f;
            color: #fff;
        }

        /* Content Section */
        .content {
            text-align: center;
            padding: 50px;
        }

        /* Contact Form Section */
        .contact-form {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 80%;
            margin: 30px auto;
            padding: 30px;
        }

        .contact-form h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .contact-form label {
            font-size: 18px;
            display: block;
            margin-bottom: 10px;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .contact-form button {
            background-color: #4f4f4f;
            color: #fff;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .contact-form button:hover {
            background-color: #333;
        }

        /* Image Gallery Section */
        .gallery {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .gallery img {
            width: 30%;
            margin: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Location Section */
        .location {
            background-color: #ececec;
            padding: 30px;
            margin-top: 40px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .location iframe {
            border: 0;
            width: 100%;
            height: 400px;
            border-radius: 8px;
        }

        /* Footer Styling */
        footer {
            background-color: #4f4f4f;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

    </style>
</head>
<body>

    <!-- Header Section with Logo -->
    <header>
        <h1>Janvi Kachhadiya</h1>
    </header>

    <!-- Navigation Bar -->
    <nav>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
        <a href="/gallry">Gallery</a>
        <a href="/portfolio">Portfolio</a>
    </nav>

    <!-- Content Section -->
    <div class="content">
        <h2>Contact Me</h2>
        <p>Feel free to reach out! I’m always open to discussing new projects, creative ideas, or opportunities to be part of your vision.</p>
    </div>

    <!-- Contact Form Section -->
    <div class="contact-form">
        <h2>Get In Touch</h2>
        <form action="#" method="POST">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>

    <!-- Image Gallery Section -->
    <div class="gallery">
        <img src="https://images.pexels.com/photos/5583248/pexels-photo-5583248.jpeg" alt="Image 1">
        <img src="https://images.pexels.com/photos/4977460/pexels-photo-4977460.jpeg" alt="Image 2">
        <img src="https://images.pexels.com/photos/3183154/pexels-photo-3183154.jpeg" alt="Image 3">
        <img src="https://images.pexels.com/photos/3747140/pexels-photo-3747140.jpeg" alt="Image 4">
        <img src="https://images.pexels.com/photos/7438099/pexels-photo-7438099.jpeg" alt="Image 5">
        <img src="https://images.pexels.com/photos/7438099/pexels-photo-7438099.jpeg" alt="Image 5">
    </div>

    <!-- Location Section (Optional: Embed Google Map) -->
    <div class="location">
        <h3>Find Me Here</h3>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3723.409003052283!2d-74.00601578473235!3d40.7127761793301!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25a7a46fc84c7%3A0x8467b9d76b6a8f1e!2sNew%20York%2C%20NY%2C%20USA!5e0!3m2!1sen!2sin!4v1617177543561!5m2!1sen!2sin" allowfullscreen="" loading="lazy"></iframe>
    </div>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 Janvi Kachhadiya. All Rights Reserved.</p>
    </footer>

</body>
</html>
