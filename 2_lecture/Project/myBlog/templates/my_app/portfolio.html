<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body styling */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Header and Logo Styling */
        header {
            background-color: #333;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }

        header h1 {
            font-size: 36px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Navigation Menu Styling */
        nav {
            text-align: center;
            margin: 20px 0;
        }

        nav a {
            color: #333;
            text-decoration: none;
            padding: 12px 20px;
            margin: 0 15px;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }

        nav a:hover {
            background-color: #5b5b5b;
            color: #fff;
        }

        /* Content Section */
        .content {
            text-align: center;
            padding: 50px;
        }

        /* Footer Styling */
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

    </style>
</head>
<body>

    <!-- Header Section with Logo -->
    <header>
        <h1>Janvi Kachhadiya</h1>
    </header>

    <!-- Navigation Bar -->
    <nav>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
        <a href="/gallry">Gallery</a>
        <a href="/portfolio">Portfolio</a>
    </nav>

    <!-- Content Section  -->
    <div class="content">
        <h2>Welcome to Janvi Kachhadiya's Website</h2>
        <p>This is your Portfolio page. Add any content you like here!</p>
    </div>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 Janvi Kachhadiya. All Rights Reserved.</p>
    </footer>

</body>
</html>
