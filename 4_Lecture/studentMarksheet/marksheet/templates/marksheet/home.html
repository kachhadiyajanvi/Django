<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9; /* Light Gray Background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333; /* Dark Gray Text */
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: #ffffff; /* White background */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Soft shadow */
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            font-size: 26px;
            color: #333; /* Dark Gray Title */
        }

        h3 {
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: 500;
            color: #444; /* Slightly lighter gray */
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            margin-bottom: 25px;
            border: 1px solid #ccc; /* Light gray border */
            border-radius: 8px;
            font-size: 16px;
            color: #333;
            background-color: #f9f9f9; /* Very light gray background */
            outline: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #4a90e2; /* Soft blue border when focused */
            background-color: #ffffff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            background-color: #4a90e2; /* Soft Blue */
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #357ab7; /* Darker blue on hover */
        }

        button:active {
            transform: translateY(2px); /* Button click effect */
        }

        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa; /* Light gray footer text */
        }

        .footer span {
            color: #4a90e2; /* Blue footer link */
            text-decoration: none;
        }

        .footer span:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Search Student Result</h2>
    <form method="GET" action="{% url 'result' %}">
        <div>
            <h3>Enrollment No:</h3>
            <input type="text" name="enroll_no" placeholder="Enter Enrollment No" required>
        </div>
        <button type="submit">Search</button>
    </form>

    <div class="footer">
        <p>Show All Student <a href="{% url 'all_students' %}">Result</a></p>
    </div>
</div>

</body>
</html>
